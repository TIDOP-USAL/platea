name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build web (producción)
        run: npm run build -- --configuration production

      - name: Generar proyecto iOS
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Compilar App (Release, sin firmar)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then
            ORIGEN="-workspace App.xcworkspace"
          else
            ORIGEN="-project App.xcodeproj"
          fi
          xcodebuild $ORIGEN \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr platea-release.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: platea-ios-release
          path: frontend/platea-release.ipa

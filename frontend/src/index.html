<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Ionic App</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport"
    content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <script>
    // Aplica el modo oscuro guardado antes de pintar la pantalla de carga
    try {
      if (localStorage.getItem('platea-modo-oscuro') === '1') document.body.classList.add('dark');
    } catch (e) { }
  </script>

  <div id="app-loader">
    <img class="loader-logo logo-claro" src="assets/img/logo_platea_transparente.png" alt="PLATEA - Diputación de Ávila">
    <img class="loader-logo logo-oscuro" src="assets/img/logo_platea_oscuro.png" alt="PLATEA - Diputación de Ávila">
    <div class="loader-tagline">CARGANDO</div>
    <div class="loader-spinner"></div>
  </div>
  <app-root></app-root>

  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      background: #eceef1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    body.dark #app-loader {
      background: #3f3f3f;
    }

    body.dark .loader-tagline {
      color: #d9d9d9;
    }

    #app-loader .logo-oscuro,
    body.dark #app-loader .logo-claro {
      display: none;
    }

    body.dark #app-loader .logo-oscuro {
      display: block;
    }

    #app-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-logo {
      width: min(280px, 70vw);
      height: auto;
      margin-bottom: 24px;
    }

    .loader-tagline {
      font-size: 11px;
      letter-spacing: 3px;
      color: #3f3f3f;
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    .loader-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(30, 143, 232, 0.2);
      border-top-color: #1e8fe8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-spinner {
        animation-duration: 2.5s;
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</body>

</html>

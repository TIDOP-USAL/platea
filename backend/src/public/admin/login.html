<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlateaGIS — Acceso Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2rem;
    }

    .logo-icon {
      width: 40px; height: 40px;
      background: #2563eb;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .logo h1 {
      font-size: 18px;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.2;
    }

    .logo span {
      font-size: 11px;
      color: #64748b;
      display: block;
      font-weight: 400;
    }

    label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
      margin-top: 1.2rem;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 7px;
      color: #f1f5f9;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #2563eb; }

    .error-box {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      border-radius: 7px;
      padding: 10px 14px;
      font-size: 13px;
      color: #fca5a5;
      margin-bottom: 1rem;
      display: none;
    }

    .error-box.visible { display: block; }

    button[type="submit"] {
      width: 100%;
      margin-top: 1.5rem;
      padding: 11px;
      background: #2563eb;
      border: none;
      border-radius: 7px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button[type="submit"]:hover { background: #1d4ed8; }
    button[type="submit"]:active { opacity: 0.85; }

    .footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 12px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🗺️</div>
      <h1>PlateaGIS <span>Panel de administración</span></h1>
    </div>

    <div class="error-box" id="errorBox"></div>

    <form method="POST" action="/admin/login">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <button type="submit">Acceder</button>
    </form>

    <p class="footer">Ávila · Diputación Provincial</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const err = params.get('error');
    const box = document.getElementById('errorBox');
    const msgs = {
      credenciales: 'Usuario o contraseña incorrectos.',
      campos_requeridos: 'Introduce usuario y contraseña.',
      servidor: 'Error interno del servidor. Inténtalo de nuevo.',
    };
    if (err && msgs[err]) {
      box.textContent = msgs[err];
      box.classList.add('visible');
    }
  </script>
</body>
</html>
